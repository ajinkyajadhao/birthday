<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory 10 💕</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
min-height:100vh;
background:linear-gradient(135deg,#ffecd2,#fcb69f);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow-x:hidden;
}

.container{
width:90%;
max-width:700px;
color:#fff;
}

.big{
font-size:30px;
font-weight:bold;
margin:20px 0;
}

.sub{
font-size:18px;
line-height:1.8;
margin:20px 0;
}

.fade{
animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.btn{
margin:25px 0;
padding:12px 30px;
background:#ff4d6d;
border:none;
border-radius:40px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:scale(1.1);
}

.row{
display:flex;
align-items:center;
margin:30px 0;
}

.row img{
width:160px;
border-radius:20px;
}

.row p{
flex:1;
padding:0 15px;
font-size:17px;
line-height:1.6;
}

.left{flex-direction:row;}
.right{flex-direction:row-reverse;}

@media(max-width:600px){
.row{flex-direction:column;}
}

</style>
</head>

<body>
