<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meri pyari cutie pie 🧸💕</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;
}

.container{
  width:90%;
  max-width:700px;
  color:white;
}

.big{font-size:28px;font-weight:bold;margin:20px 0;}
.sub{font-size:18px;line-height:1.8;margin:20px 0;}

.fadeIn{animation:fadeIn 0.8s forwards;}
.fadeOut{animation:fadeOut 0.6s forwards;}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes fadeOut{
  to{opacity:0;transform:translateY(-20px);}
}

.btn{
  margin:25px 0;
  padding:12px 30px;
  background:#ff6fa5;
  border:none;
  border-radius:40px;
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{transform:scale(1.1);}

.row{
  display:flex;
  align-items:center;
  margin:25px 0;
}
.row img{
  width:150px;
  border-radius:20px;
}
.row p{
  flex:1;
  padding:0 15px;
  font-size:16px;
  line-height:1.6;
}

.left{flex-direction:row;}
.right{flex-direction:row-reverse;}

@media(max-width:600px){
  .row{flex-direction:column;}
}
</style>
</head>

<body>

<div id="main" class="container"></div>

<script>

let main=document.getElementById("main");

/* SHOW FUNCTION (vanish old → show new) */
function showContent(content){
  main.classList.add("fadeOut");

  setTimeout(()=>{
    main.innerHTML = content;
    main.classList.remove("fadeOut");
    main.classList.add("fadeIn");
  },500);
}

/* INTRO */
